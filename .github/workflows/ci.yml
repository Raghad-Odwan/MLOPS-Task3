name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: black --check src/ app/ tests/

      - name: Lint with flake8
        run: flake8 src/ app/ tests/ --max-line-length=120 --extend-ignore=E203

      - name: Register the model with MLflow (fresh, for this CI run)
        run: python register_model.py

      - name: Run tests with pytest
        run: pytest tests/ -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test  # only build the image if lint and tests passed

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t late-delivery-api:${{ github.sha }} .